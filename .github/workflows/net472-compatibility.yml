name: .NET Framework Compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  net472-compatibility:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore expressium-livingdoc.sln

      - name: Build solution
        run: dotnet build expressium-livingdoc.sln --no-restore --configuration Release

      - name: Run .NET Framework 4.7.2 smoke tests
        run: dotnet test Expressium.LivingDoc.Net472Tests/Expressium.LivingDoc.Net472Tests.csproj --no-restore --configuration Release --no-build

  reqnroll-livingdoc-report:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore expressium-livingdoc.sln

      - name: Build Reqnroll compatibility fixture
        run: dotnet build Expressium.LivingDoc.ReqnrollCompatibilityTests/Expressium.LivingDoc.ReqnrollCompatibilityTests.csproj --no-restore --configuration Release

      - name: Run Reqnroll scenarios and generate LivingDoc
        run: dotnet test Expressium.LivingDoc.ReqnrollCompatibilityTests/Expressium.LivingDoc.ReqnrollCompatibilityTests.csproj --no-restore --configuration Release --no-build

      - name: Upload generated LivingDoc report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expressium-livingdoc-reqnroll-report
          path: Expressium.LivingDoc.ReqnrollCompatibilityTests/**/artifacts/*
          if-no-files-found: error
